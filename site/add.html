<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Добавить в календарь — Радар</title>
<style>
body{margin:0;background:#0c0c0f;color:#ecebf2;font:16px/1.45 -apple-system,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{max-width:420px;padding:28px 22px;text-align:center}
h1{font-size:20px;margin:0 0 6px}p{color:#8f8e9b;margin:8px 0 18px}
a.b{display:block;background:#ecebf2;color:#0c0c0f;text-decoration:none;font-weight:600;border-radius:14px;padding:15px;margin:10px 0}
a.g{background:#1b1b23;color:#ecebf2;border:1px solid #272731}
small{color:#8f8e9b;display:block;margin-top:16px}
</style></head><body><main>
<h1 id="t">Добавить в календарь</h1>
<p id="w"></p>
<a class="b" id="safari" href="#" hidden>Открыть в Safari и добавить</a>
<a class="b" id="apple" href="#">Добавить в Apple Календарь</a>
<a class="b g" id="google" href="#">Добавить в Google Календарь</a>
<small id="hint">Если iPhone предлагает «подписку» — закройте её и нажмите «Открыть в Safari»: в Safari событие добавится одним касанием.</small>
</main>
<script>
(async () => {
  const q = new URLSearchParams(location.search), id = q.get("id") || "";
  const ics = new URL("ics/" + encodeURIComponent(id) + ".ics", location.href).href;
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  document.getElementById("apple").href = ics;
  if (IOS) { const sf = document.getElementById("safari"); sf.hidden = false;
    const u = new URL(location.href); u.searchParams.set("s", "1"); sf.href = "x-safari-" + u.href; }
  const mon = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  try {
    const d = await (await fetch("data/events.json", { cache: "no-cache" })).json();
    const e = d.events.find((x) => x.id === id);
    if (e) {
      document.getElementById("t").textContent = e.calSummary || e.title;
      const [y, m, dd] = (e.start || "").split("-").map(Number);
      const when = e.start ? `${dd} ${mon[m - 1]}${e.time ? ", " + e.time : ""}` : "";
      document.getElementById("w").textContent = [when, e.venue, e.city].filter(Boolean).join(" · ");
      if (e.gcal) document.getElementById("google").href = e.gcal;
    }
  } catch (_) {}
  // s=1 — страница уже открыта в Safari: сразу открываем событие (iPhone покажет «Добавить в Календарь»)
  if (q.get("s") === "1" && q.get("k") === "apple") location.href = ics;
  if (q.get("k") === "google") { const g = document.getElementById("google").getAttribute("href"); if (g && g !== "#") location.href = g; }
})();
</script></body></html>
