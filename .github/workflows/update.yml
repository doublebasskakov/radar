name: Обновить афишу

on:
  schedule:
    - cron: "17 3 * * *"     # каждый день в 06:17 по Москве
    - cron: "43 9 * * *"     # 12:43 по Москве — только уточнить время (после сброса квоты Gemini)
    - cron: "17 15 * * *"    # 18:17 по Москве — второй сбор за день
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "all — полный сбор, times — уточнить время, publish — опубликовать текущую базу"
        default: all
  push:
    branches: [main]
    paths: ["site/**", "data/events.json", "data/editor.yaml", "scraper/**", ".github/workflows/update.yml"]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  # правки сайта (push) публикуются сразу и не ждут долгого сбора
  group: afisha-${{ github.event_name == 'push' && 'publish' || 'collect' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt

      - name: Собрать новые события (Telegram, сайты, RSS)
        if: github.event_name != 'push' && inputs.mode != 'publish'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AFISHA_MODEL: ${{ vars.AFISHA_MODEL || 'claude-haiku-5-5' }}
        run: |
          if [ -z "$GEMINI_API_KEY$ANTHROPIC_API_KEY" ]; then echo "Нет ключа модели (GEMINI_API_KEY) — пропускаю сбор"; exit 0; fi
          if [ "${{ inputs.mode }}" = "times" ] || [ "${{ github.event.schedule }}" = "43 9 * * *" ]; then python scraper/robot.py times; else python scraper/robot.py collect; fi

      - name: Собрать сайт и календари
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/robot.py build

      - name: Сохранить изменения
        run: |
          git config user.name "afisha-robot"
          git config user.email "afisha-robot@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet || git commit -m "Обновление афиши $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours; }
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Дождаться доступности пакета GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" \
              --jq '[.artifacts[] | select(.expired == false)] | length') && [ "$count" -eq 1 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "::error::Пакет github-pages недоступен после загрузки"
          exit 1

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
