name: Обновить афишу

on:
  schedule:
    - cron: "17 3 * * *"     # каждый день в 06:17 по Москве
    - cron: "43 9 * * *"     # 12:43 по Москве — только уточнить время (после сброса квоты Gemini)
    - cron: "17 15 * * *"    # 18:17 по Москве — второй сбор за день
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
    inputs:
      mode:
        description: "all — полный сбор, times — уточнить время, publish — опубликовать текущую базу, api — проверить подключение к моделям"
        default: all
  push:
    branches: [main]
    paths: ["site/**", "data/events.json", "data/editor.yaml", "scraper/**", "tests/**", "requirements.txt", ".github/workflows/update.yml"]

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  # правки сайта (push) публикуются сразу и не ждут долгого сбора
  group: afisha-${{ (inputs.mode == 'api' && 'api') || (github.event_name == 'push' && 'publish') || 'collect' }}
  cancel-in-progress: false

jobs:
  api-check:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'api'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt
      - name: Проверить ответ Workers AI
        env:
          RADAR_AI_PROVIDER: cloudflare
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python -c 'from scraper.robot import llm_text; llm_text("Reply with OK."); print("Workers AI ответил через Cloudflare")'

  update:
    if: inputs.mode != 'api'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.package.outputs.name }}
      generated: ${{ steps.manifest.outputs.generated }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -r requirements.txt pytest==8.4.2
      - name: Проверить даты и тематику
        run: python -m pytest -q

      - name: Собрать новые события (Telegram, сайты, RSS)
        if: github.event_name != 'push' && inputs.mode != 'publish'
        env:
          RADAR_AI_PROVIDER: cloudflare
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          UPDATE_MODE: ${{ inputs.mode }}
          UPDATE_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Для Workers AI нужны ID аккаунта и токен"; exit 1; fi
          if [ "$UPDATE_MODE" = "times" ] || [ "$UPDATE_SCHEDULE" = "43 9 * * *" ]; then python scraper/robot.py times; else python scraper/robot.py collect; fi

      - name: Собрать сайт и календари
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scraper/robot.py build

      - name: Проверить собранную афишу
        id: manifest
        run: |
          jq -e '.generated | test("^[0-9]{8}T[0-9]{6}Z$")' site/data/events.json >/dev/null
          jq -e '.count > 0 and .count == (.events | length)' site/data/events.json >/dev/null
          echo "generated=$(jq -r .generated site/data/events.json)" >> "$GITHUB_OUTPUT"

      - name: Сохранить изменения
        run: |
          git config user.name "afisha-robot"
          git config user.email "afisha-robot@users.noreply.github.com"
          git add -A data site
          git diff --cached --quiet || git commit -m "Обновление афиши $(date -u +%F)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours; }
          done

      - uses: actions/configure-pages@v5
      - name: Выбрать имя пакета
        id: package
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: ${{ steps.package.outputs.name }}

  publish:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Дождаться доступности пакета GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: ${{ needs.update.outputs.artifact }}
        run: |
          for attempt in {1..12}; do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT" \
              --jq '[.artifacts[] | select(.expired == false)] | length') && [ "$count" -eq 1 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "::error::Пакет github-pages недоступен после загрузки"
          exit 1

      - id: deploy
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ needs.update.outputs.artifact }}
      - name: Проверить опубликованные данные
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          GENERATED: ${{ needs.update.outputs.generated }}
        run: |
          for attempt in {1..12}; do
            if curl -fsS --max-time 10 "${PAGE_URL%/}/data/events.json?verify=$GENERATED-$attempt" |
              jq -e --arg generated "$GENERATED" '.generated == $generated and .count > 0 and .count == (.events | length)' >/dev/null; then
              echo "Публичная афиша проверена ($GENERATED)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "::error::Публичная афиша не отдаёт данные этой сборки ($GENERATED)"
          exit 1
